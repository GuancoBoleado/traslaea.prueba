<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>TRASLAEA - Asociación de Electricistas de Traslasierra</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

<style>
    /* Contenedor principal de las 3 imágenes */
    .bg-images-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background-color: #1a1a1a;
        overflow: hidden;
    }
    
    .bg-images-container img {
        width: 100%;
        height: 100vh;
        object-fit: cover;
        opacity: 0.75; 
        filter: blur(2px) sepia(60%) brightness(100%) contrast(110%);
        animation: aparecerFondo 4s ease-in-out forwards;
    }

    @keyframes aparecerFondo {
        0% { opacity: 0; filter: blur(0px) sepia(0%); transform: scale(1.05); }
        30% { opacity: 1; filter: blur(0px) sepia(0%); }
        100% { opacity: 0.75; filter: blur(2px) sepia(60%); transform: scale(1); }
    }

    #mapa-socios { z-index: 1; }

    @media (max-width: 768px) {
        .bg-images-container { grid-template-columns: 1fr; grid-template-rows: repeat(3, 1fr); }
        .bg-images-container img { height: 33.33vh; }
    }

    .backdrop-blur-md {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    /* Fix para asegurar que los links sean clickeables sobre el fondo */
    header a, header button, .relative.z-10 a {
        position: relative;
        z-index: 50;
    }
</style>
</head>
