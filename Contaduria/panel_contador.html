<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Contable • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal-hidden { display: none !important; }
        .mes-card { transition: all 0.3s; cursor: pointer; }
    </style>
</head>
<body class="bg-[#001220] text-white min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-white/5 p-6 rounded-3xl border border-white/10">
            <div>
                <h1 class="text-2xl font-black text-orange-500 italic uppercase">TRASLAEA</h1>
                <p class="text-blue-300 text-xs tracking-widest uppercase opacity-60">Gestión de Asociados y Pagos</p>
            </div>
            <div class="flex gap-4">
                <button id="btnSalir" class="px-6 py-2 border border-red-500/50 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition text-sm font-bold uppercase">
                    Cerrar Sesión
                </button>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="flex-1 relative">
                <input type="text" id="inputBusqueda" placeholder="Buscar por DNI o Apellido..." 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 focus:outline-none focus:border-orange-500 transition text-white">
            </div>
            <button onclick="window.location.href='nuevo_socio.html'" class="bg-orange-500 hover:bg-orange-600 text-white px-8 py-4 rounded-2xl font-bold transition flex items-center justify-center gap-2 text-sm uppercase">
                <span>+</span> Nuevo Socio
            </button>
        </div>

        <div class="bg-white/5 rounded-[2.5rem] border border-white/10 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white/5 text-blue-300 text-[10px] uppercase tracking-[0.2em]">
                        <tr>
                            <th class="p-6">Técnico / Socio</th>
                            <th class="p-6">DNI</th>
                            <th class="p-6 text-center">Estado</th>
                            <th class="p-6 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSocios" class="divide-y divide-white/5">
                        <tr><td colspan="4" class="p-10 text-center opacity-40 text-white">Cargando asociados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modalPagos" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50 modal-hidden">
        <div class="bg-[#001220] border border-white/20 w-full max-w-4xl rounded-[2.5rem] overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
            <div class="p-8 border-b border-white/10 flex justify-between items-center">
                <div>
                    <h2 id="modalNombreSocio" class="text-3xl font-black text-white uppercase italic">Cargando...</h2>
                    <p id="modalDniSocio" class="text-orange-500 font-bold text-sm tracking-widest">DNI: --</p>
                </div>
                <button id="btnCerrarModal" class="bg-white/5 hover:bg-red-500 text-white w-12 h-12 rounded-full text-2xl transition flex items-center justify-center border border-white/10">
                    &times;
                </button>
            </div>
            
            <div class="p-8">
                <div id="grillaMeses" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                    </div>
            </div>

            <div class="p-6 bg-white/5 flex justify-center">
                <p class="text-[10px] text-white/40 uppercase tracking-widest font-bold text-center">Panel Administrativo • TRASLAEA 2026</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { verificarSesion, salir } from './auth-service.js';
        import { obtenerSocios } from './socios-service.js';

        let todosLosSocios = [];

        // 1. Verificar sesión
        try {
            await verificarSesion();
        } catch (e) {
            console.error("No hay sesión activa");
        }

        // 2. Salir
        document.getElementById('btnSalir').addEventListener('click', salir);

        // 3. Inicializar tabla
        async function inicializar() {
            const tbody = document.getElementById('tablaSocios');
            try {
                todosLosSocios = await obtenerSocios();
                renderizarTabla(todosLosSocios);
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-400 font-bold">Error al conectar con la base de datos.</td></tr>`;
            }
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tablaSocios');
            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-40">No hay registros aún.</td></tr>`;
                return;
            }

            tbody.innerHTML = lista.map(s => `
                <tr class="hover:bg-white/5 transition border-b border-white/5 last:border-0">
                    <td class="p-6">
                        <div class="font-bold text-white uppercase text-sm italic">${s.apellido || ''}, ${s.nombre || ''}</div>
                        <div class="text-[10px] text-blue-300/50 uppercase tracking-widest">${s.localidad || 'Traslasierra'}</div>
                    </td>
                    <td class="p-6 opacity-60 text-xs font-mono font-bold">${s.dni || '-'}</td>
                    <td class="p-6 text-center text-white">
                        <span class="px-3 py-1 rounded-lg text-[9px] font-black uppercase border ${s.estado_pago === 'Al día' ? 'bg-green-500/20 text-green-500 border-green-500/50' : 'bg-red-500/20 text-red-500 border-red-500/50'}">
                            ${s.estado_pago || 'PENDIENTE'}
                        </span>
                    </td>
                    <td class="p-6 text-right">
                        <button onclick="abrirAlmanaque('${s.id}', '${s.nombre} ${s.apellido}', '${s.dni}')" 
                            class="bg-orange-500/10 hover:bg-orange-500 text-orange-500 hover:text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase transition border border-orange-500/20">
                            Ver Pagos
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 4. Buscador
        document.getElementById('inputBusqueda').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtrados = todosLosSocios.filter(s => 
                (s.apellido || "").toLowerCase().includes(term) || 
                (s.nombre || "").toLowerCase().includes(term) || 
                (s.dni || "").toString().includes(term)
            );
            renderizarTabla(filtrados);
        });

        // 5. Función Global del Modal
        window.abrirAlmanaque = (id, nombre, dni) => {
            const modal = document.getElementById('modalPagos');
            const grilla = document.getElementById('grillaMeses');
            
            document.getElementById('modalNombreSocio').innerText = nombre;
            document.getElementById('modalDniSocio').innerText = `DNI: ${dni}`;
            
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            grilla.innerHTML = meses.map((mes, index) => {
                const pagado = index < 3; // Simulación (luego vendrá de base de datos)
                const estilo = pagado 
                    ? 'bg-green-500/10 border-green-500 text-green-400' 
                    : 'bg-red-500/10 border-red-500 text-red-400';
                
                return `
                    <div class="border-2 ${estilo} p-4 rounded-2xl text-center transition hover:scale-105">
                        <span class="block text-[8px] uppercase opacity-60 mb-1 tracking-tighter text-white">Cuota 2026</span>
                        <span class="font-black block text-sm uppercase text-white">${mes}</span>
                        <span class="block text-[10px] mt-2 font-black italic tracking-widest">${pagado ? 'PAGADO' : 'PENDIENTE'}</span>
                    </div>
                `;
            }).join('');

            modal.classList.remove('modal-hidden');
        };

        // 6. Cerrar Modal (Inmune a fallos)
        const cerrarModal = () => {
            document.getElementById('modalPagos').classList.add('modal-hidden');
        };

        document.getElementById('btnCerrarModal').onclick = cerrarModal;
        document.getElementById('modalPagos').onclick = cerrarModal;

        inicializar();
    </script>
</body>
</html>
