<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo 3D Traslaea</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* Estilos 3D puros en CSS */
    .cube-container {
      perspective: 1000px;
    }
    
    .cube {
      width: 200px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-20deg) rotateY(20deg);
    }
    
    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      background: white;
      border: 2px solid #0052cc;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0, 82, 204, 0.15);
      backface-visibility: visible;
    }

    /* Posicionamiento de las 6 caras en el espacio 3D */
    .front  { transform: translateZ(100px); }
    .back   { transform: rotateY(180deg) translateZ(100px); }
    .left   { transform: rotateY(-90deg) translateZ(100px); }
    .right  { transform: rotateY(90deg) translateZ(100px); }
    .top    { transform: rotateX(90deg) translateZ(100px); }
    .bottom { transform: rotateX(-90deg) translateZ(100px); }

    /* Imagen del logo adaptada a la cara */
    .face img {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center flex flex-col items-center">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Simulador Cubo 3D</h1>
    <p class="text-sm text-slate-500 mb-8">Traslasierra Electricistas Asociados</p>

    <div class="cube-container h-64 w-full flex items-center justify-center mb-6">
      <div id="logoCube" class="cube">
        <div class="face front">
          <img src="https://images.squarespace-cdn.com/content/v1/64010da9558a361b2fa1f759/da081a2f-7be3-488b-a48a-6691c28c89a7/TRASLAEA.png" alt="Logo Traslaea">
        </div>
        <div class="face back">
          <img src="https://images.squarespace-cdn.com/content/v1/64010da9558a361b2fa1f759/da081a2f-7be3-488b-a48a-6691c28c89a7/TRASLAEA.png" alt="Logo Traslaea">
        </div>
        <div class="face left">
          <img src="https://images.squarespace-cdn.com/content/v1/64010da9558a361b2fa1f759/da081a2f-7be3-488b-a48a-6691c28c89a7/TRASLAEA.png" alt="Logo Traslaea">
        </div>
        <div class="face right">
          <img src="https://images.squarespace-cdn.com/content/v1/64010da9558a361b2fa1f759/da081a2f-7be3-488b-a48a-6691c28c89a7/TRASLAEA.png" alt="Logo Traslaea">
        </div>
        <div class="face top">
          <img src="https://images.squarespace-cdn.com/content/v1/64010da9558a361b2fa1f759/da081a2f-7be3-488b-a48a-6691c28c89a7/TRASLAEA.png" alt="Logo Traslaea">
        </div>
        <div class="face bottom">
          <img src="https://images.squarespace-cdn.com/content/v1/64010da9558a361b2fa1f759/da081a2f-7be3-488b-a48a-6691c28c89a7/TRASLAEA.png" alt="Logo Traslaea">
        </div>
      </div>
    </div>

    <div class="w-full space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
      
      <div>
        <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
          <span>Velocidad de Giro</span>
          <span id="speedVal">1x</span>
        </div>
        <input id="speedControl" type="range" min="0" max="4" step="0.5" value="1" 
               class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
      </div>

      <div>
        <span class="block text-xs font-semibold text-slate-600 text-left mb-2">Eje de Rotación</span>
        <div class="grid grid-cols-3 gap-2">
          <button id="btnHorizontal" class="py-1.5 px-3 text-xs font-medium rounded-lg bg-blue-600 text-white shadow-sm transition">
            Horizontal
          </button>
          <button id="btnVertical" class="py-1.5 px-3 text-xs font-medium rounded-lg bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 transition">
            Vertical
          </button>
          <button id="btnAmbos" class="py-1.5 px-3 text-xs font-medium rounded-lg bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 transition">
            Ambos
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const cube = document.getElementById('logoCube');
    const speedControl = document.getElementById('speedControl');
    const speedVal = document.getElementById('speedVal');
    
    const btnHorizontal = document.getElementById('btnHorizontal');
    const btnVertical = document.getElementById('btnVertical');
    const btnAmbos = document.getElementById('btnAmbos');

    let angleX = -20;
    let angleY = 20;
    let speedMultiplier = 1;
    let mode = 'horizontal'; // horizontal, vertical, ambos

    // Actualizar multiplicador de velocidad
    speedControl.addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
      speedVal.textContent = speedMultiplier === 0 ? 'Pausado' : speedMultiplier + 'x';
    });

    // Cambiar modos de dirección
    function setMode(newMode, activeBtn) {
      mode = newMode;
      [btnHorizontal, btnVertical, btnAmbos].forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700', 'border', 'border-slate-300');
      });
      activeBtn.classList.remove('bg-white', 'text-slate-700', 'border', 'border-slate-300');
      activeBtn.classList.add('bg-blue-600', 'text-white');
    }

    btnHorizontal.addEventListener('click', () => setMode('horizontal', btnHorizontal));
    btnVertical.addEventListener('click', () => setMode('vertical', btnVertical));
    btnAmbos.addEventListener('click', () => setMode('ambos', btnAmbos));

    // Bucle de animación nativo (60 FPS aproximados)
    function animate() {
      if (speedMultiplier > 0) {
        if (mode === 'horizontal' || mode === 'ambos') {
          angleY += 0.8 * speedMultiplier;
        }
        if (mode === 'vertical' || mode === 'ambos') {
          angleX += 0.8 * speedMultiplier;
        }
      }
      
      // Aplicar la rotación al elemento del cubo
      cube.style.transform = `rotateX(${angleX}deg) rotateY(${angleY}deg)`;
      requestAnimationFrame(animate);
    }

    // Iniciar la animación
    animate();
  </script>
</body>
</html>
