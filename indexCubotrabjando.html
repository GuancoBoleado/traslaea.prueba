<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximamente novedades</title>
  <!-- Tailwind CSS para el diseño de la interfaz -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* Estilos 3D puros en CSS */
    .cube-container {
      perspective: 1000px;
    }
    
    .cube {
      width: 200px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-20deg) rotateY(20deg);
    }
    
    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      background: white;
      border: 2px solid #0052cc;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0, 82, 204, 0.15);
      backface-visibility: visible;
    }

    /* Posicionamiento de las 6 caras en el espacio 3D */
    .front  { transform: translateZ(100px); }
    .back   { transform: rotateY(180deg) translateZ(100px); }
    .left   { transform: rotateY(-90deg) translateZ(100px); }
    .right  { transform: rotateY(90deg) translateZ(100px); }
    .top    { transform: rotateX(90deg) translateZ(100px); }
    .bottom { transform: rotateX(-90deg) translateZ(100px); }

    /* Imagen del logo adaptada a la cara */
    .face img {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    /* Fondo de cuadrícula técnica (falsa escuadra / wireframe) */
    .tech-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 82, 204, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 82, 204, 0.04) 1px, transparent 1px);
    }

    /* Animación suave para el gradiente del fondo */
    @keyframes pulseBg {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .animated-bg {
      animation: pulseBg 8s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-950 font-sans min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden tech-grid">

  <!-- Capa de gradiente dinámico de fondo -->
  <div class="absolute inset-0 bg-gradient-to-tr from-slate-900 via-blue-950 to-slate-900 animated-bg -z-10"></div>

  <!-- Detalle estético: Barra de precaución de obra en el borde superior -->
  <div class="absolute top-0 left-0 w-full h-1.5 bg-[length:20px_20px] bg-[linear-gradient(45deg,rgba(245,158,11,0.85)_25%,rgba(30,41,59,0.85)_25%,rgba(30,41,59,0.85)_50%,rgba(245,158,11,0.85)_50%,rgba(245,158,11,0.85)_75%,rgba(30,41,59,0.85)_75%,rgba(30,41,59,0.85))]"></div>

  <!-- Tarjeta Principal -->
  <div class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full text-center flex flex-col items-center border border-slate-200/50 relative z-10">
    
    <!-- Badge de "Sitio en construcción" -->
    <span class="mb-3 inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 animate-pulse">
      <span class="w-2 h-2 rounded-full bg-amber-500"></span>
      Sitio en construcción
    </span>

    <h1 class="text-2xl font-bold text-slate-800 mb-1">Próximamente novedades</h1>
    <p class="text-sm font-medium text-blue-600 mb-6">Traslasierra Electricistas Asociados</p>

    <!-- Contenedor del Cubo Animado -->
    <div class="cube-container h-64 w-full flex items-center justify-center mb-6">
      <div id="logoCube" class="cube">
        <!-- Cara Frontal -->
        <div class="face front">
          <img src="logoooo.png" alt="Logo Traslaea">
        </div>
        <!-- Cara Trasera -->
        <div class="face back">
          <img src="logoooo.png" alt="Logo Traslaea">
        </div>
        <!-- Cara Izquierda -->
        <div class="face left">
          <img src="logoooo.png" alt="Logo Traslaea">
        </div>
        <!-- Cara Derecha -->
        <div class="face right">
          <img src="logoooo.png" alt="Logo Traslaea">
        </div>
        <!-- Cara Superior -->
        <div class="face top">
          <img src="logoooo.png" alt="Logo Traslaea">
        </div>
        <!-- Cara Inferior -->
        <div class="face bottom">
          <img src="logoooo.png" alt="Logo Traslaea">
        </div>
      </div>
    </div>

    <!-- Panel de Controles -->
    <div class="w-full space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
      
      <!-- Control de Velocidad -->
      <div>
        <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
          <span>Velocidad de Giro</span>
          <span id="speedVal">1x</span>
        </div>
        <input id="speedControl" type="range" min="0" max="4" step="0.5" value="1" 
               class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
      </div>

      <!-- Control de Dirección -->
      <div>
        <span class="block text-xs font-semibold text-slate-600 text-left mb-2">Eje de Rotación</span>
        <div class="grid grid-cols-3 gap-2">
          <button id="btnHorizontal" class="py-1.5 px-3 text-xs font-medium rounded-lg bg-blue-600 text-white shadow-sm transition">
            Horizontal
          </button>
          <button id="btnVertical" class="py-1.5 px-3 text-xs font-medium rounded-lg bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 transition">
            Vertical
          </button>
          <button id="btnAmbos" class="py-1.5 px-3 text-xs font-medium rounded-lg bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 transition">
            Ambos
          </button>
        </div>
      </div>
    </div>

    <!-- Sección de Convocatoria / WhatsApp -->
    <div class="w-full pt-4 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-500 mb-3 font-medium">¿Querés formar parte o sumar tu apoyo?</p>
      <a href="https://wa.me/5493544649941?text=Hola+Esteban+quiero+sumarme+al+proyecto." 
         target="_blank" 
         rel="noopener noreferrer" 
         class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow-md shadow-emerald-600/10 transition-all duration-200 active:scale-[0.98]">
        <!-- Icono de WhatsApp SVG -->
        <svg class="w-5 h-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.411 0 11.981 0c3.184.001 6.177 1.242 8.426 3.496 2.248 2.253 3.487 5.244 3.486 8.428-.003 6.577-5.354 11.926-11.922 11.926-1.995-.001-3.956-.5-5.699-1.448L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.863-9.742.002-2.602-1.011-5.05-2.854-6.895C16.579 2.122 14.132 1.1 11.533 1.1c-5.441 0-9.864 4.372-9.867 9.746-.002 1.742.482 3.442 1.399 4.909L2.094 21.84l6.113-1.602c.168.04.163.04.44.076zM17.15 14.934c-.305-.153-1.808-.891-2.088-.992-.28-.102-.485-.153-.688.152-.203.305-.788.992-.966 1.194-.178.203-.355.228-.66.076-.305-.152-1.288-.475-2.454-1.514-.908-.81-1.52-1.81-1.698-2.115-.178-.305-.019-.47.133-.621.137-.136.305-.355.457-.533.152-.178.203-.305.305-.508.102-.203.05-.381-.025-.533-.076-.152-.688-1.657-.942-2.268-.247-.595-.5-.514-.688-.524-.178-.009-.381-.01-.584-.01s-.533.076-.813.381c-.28.305-1.067 1.042-1.067 2.54 0 1.498 1.092 2.946 1.244 3.149.152.203 2.15 3.284 5.207 4.601.727.314 1.294.502 1.737.643.73.232 1.394.199 1.918.121.584-.087 1.808-.737 2.062-1.449.254-.712.254-1.322.178-1.449-.076-.127-.28-.203-.584-.356z"/>
        </svg>
        Enviar WhatsApp para sumarse
      </a>
    </div>

  </div>

  <!-- Lógica de Animación Interactiva -->
  <script>
    const cube = document.getElementById('logoCube');
    const speedControl = document.getElementById('speedControl');
    const speedVal = document.getElementById('speedVal');
    
    const btnHorizontal = document.getElementById('btnHorizontal');
    const btnVertical = document.getElementById('btnVertical');
    const btnAmbos = document.getElementById('btnAmbos');

    let angleX = -20;
    let angleY = 20;
    let speedMultiplier = 1;
    let mode = 'horizontal'; // horizontal, vertical, ambos

    // Actualizar multiplicador de velocidad
    speedControl.addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
      speedVal.textContent = speedMultiplier === 0 ? 'Pausado' : speedMultiplier + 'x';
    });

    // Cambiar modos de dirección
    function setMode(newMode, activeBtn) {
      mode = newMode;
      [btnHorizontal, btnVertical, btnAmbos].forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700', 'border', 'border-slate-300');
      });
      activeBtn.classList.remove('bg-white', 'text-slate-700', 'border', 'border-slate-300');
      activeBtn.classList.add('bg-blue-600', 'text-white');
    }

    btnHorizontal.addEventListener('click', () => setMode('horizontal', btnHorizontal));
    btnVertical.addEventListener('click', () => setMode('vertical', btnVertical));
    btnAmbos.addEventListener('click', () => setMode('ambos', btnAmbos));

    // Bucle de animación nativo (60 FPS aproximados)
    function animate() {
      if (speedMultiplier > 0) {
        if (mode === 'horizontal' || mode === 'ambos') {
          angleY += 0.8 * speedMultiplier;
        }
        if (mode === 'vertical' || mode === 'ambos') {
          angleX += 0.8 * speedMultiplier;
        }
      }
      
      // Aplicar la rotación al elemento del cubo
      cube.style.transform = `rotateX(${angleX}deg) rotateY(${angleY}deg)`;
      requestAnimationFrame(animate);
    }

    // Iniciar la animación
    animate();
  </script>
</body>
</html>
