<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <title>Contacto - Traslaea</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
        }
        header a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 35px;
            background: #172033;
            border: 1px solid #283548;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            flex-grow: 1;
        }
        h1 {
            color: #f8fafc;
            font-size: 1.9rem;
            margin-bottom: 10px;
            text-align: center;
        }
        p.subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.05rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cbd5e1;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button:hover:not(:disabled) {
            background: #0369a1;
        }
        button:disabled {
            background: #475569;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-home:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <header>
        <!-- Ruta corregida para salir de la carpeta 'paginas' hacia la raíz -->
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Volver al inicio de Traslaea</a>
    </header>

    <div class="container">
        <h1>¡Comunicate con Traslaea!</h1>
        <p class="subtitle">Dejanos tu consulta y nos ponemos en contacto con vos.</p>

        <!-- REEMPLAZA "tu-codigo-formspree" CON EL ID QUE TE DA FORMSPREE -->
        <form action="https://formspree.io/f/tu-codigo-formspree" method="POST" id="contactForm">
            
            <div class="form-group">
                <label for="name">Tu Nombre / Empresa:</label>
                <input type="text" id="name" name="name" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
                <label for="email">Tu Correo Electrónico (Ingresalo si deseas respuesta):</label>
                <input type="text" id="email" name="email" placeholder="tu_correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" rows="5" required placeholder="Escribinos tu consulta técnica o mensaje institucional..."></textarea>
            </div>

            <!-- Mensaje predeterminado oculto o paramétrico que te ayuda a identificar de dónde vino -->
            <input type="hidden" name="_subject" value="Nuevo mensaje desde la Web de Traslaea">

            <button type="submit" id="submitBtn" disabled><i class="fas fa-paper-plane"></i> Enviar Mensaje</button>
        </form>

        <!-- Ruta corregida para salir de la carpeta 'paginas' hacia la raíz -->
        <a href="../index.html" class="back-home">← Ir a la página principal</a>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const nameInput = document.getElementById('name');
        const messageInput = document.getElementById('message');

        function validarFormulario() {
            const emailValue = emailInput.value.trim();
            const nameValue = nameInput.value.trim();
            const messageValue = messageInput.value.trim();

            const tieneEmailValido = emailValue.length > 0 && emailValue.includes('@');
            const camposObligatoriosListos = nameValue.length > 0 && messageValue.length > 0;

            if (camposObligatoriosListos && tieneEmailValido) {
                submitBtn.removeAttribute('disabled');
            } else {
                submitBtn.setAttribute('disabled', 'true');
            }
        }

        emailInput.addEventListener('input', validarFormulario);
        nameInput.addEventListener('input', validarFormulario);
        messageInput.addEventListener('input', validarFormulario);
    </script>

</body>
</html>
