<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASLAEA - Carga de Batería</title>
    <style>
        body { background: #001b3a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { border: 4px solid #f97316; background: #000; box-shadow: 0 0 30px rgba(0,0,0,0.5); border-radius: 15px; }
        h1 { color: #f97316; margin-bottom: 5px; font-style: italic; text-transform: uppercase; }
        .score { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #4ade80; }
        
        /* RECUPERADO: El botón naranja original que te gustaba */
        .btn-volver { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: #f97316; 
            color: white; 
            padding: 10px 15px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 12px; 
            font-weight: bold; 
            box-shadow: 0 4px 0 #c2410c;
            transition: all 0.1s;
        }
        .btn-volver:active { transform: translateY(2px); box-shadow: 0 2px 0 #c2410c; }
    </style>
</head>
<body>
    <a href="juegos.html" class="btn-volver">← VOLVER</a>
    <h1>CARGA DE BATERÍA</h1>
    <div class="score" id="scoreVal">Voltaje: 0V</div>
    <canvas id="snakeGame"></canvas>

<script>
    const canvas = document.getElementById("snakeGame");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("scoreVal");

    const logo = new Image();
    logo.src = "logo.png";

    const box = 20;
    canvas.width = 400; 
    canvas.height = 400;

    let snake = [{ x: 10 * box, y: 10 * box }];
    let food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
    let d = "RIGHT";
    let score = 0;
    let gameSpeed = 130; 

    document.addEventListener("keydown", direction);
    function direction(event) {
        if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(event.keyCode == 38 && d != "DOWN") d = "UP";
        else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(event.keyCode == 40 && d != "UP") d = "DOWN";
    }

    function draw() {
        // 1. Fondo Azul TRASLAEA
        ctx.fillStyle = "#002855";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. LOGO CIRCULAR (Mantenido exactamente igual)
        ctx.save();
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.arc(200, 200, 100, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(logo, 100, 100, 200, 200);
        ctx.restore();

        // 3. Dibujar Celdas de Batería (Culebra)
        for(let i = 0; i < snake.length; i++) {
            // Cabeza naranja (Borna positivo), cuerpo verde (Celdas cargadas)
            ctx.fillStyle = (i == 0) ? "#f97316" : "#4ade80"; 
            ctx.fillRect(snake[i].x, snake[i].y, box-2, box-2);
        }

        // 4. Comida (Rayo de carga ⚡)
        ctx.font = "18px Arial";
        ctx.fillText("⚡", food.x + 2, food.y + 16);

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if( d == "LEFT") snakeX -= box;
        if( d == "UP") snakeY -= box;
        if( d == "RIGHT") snakeX += box;
        if( d == "DOWN") snakeY += box;

        // --- EFECTO TÚNEL ---
        if (snakeX < 0) snakeX = canvas.width - box;
        else if (snakeX >= canvas.width) snakeX = 0;
        if (snakeY < 0) snakeY = canvas.height - box;
        else if (snakeY >= canvas.height) snakeY = 0;

        // Lógica de Voltaje
        if(snakeX == food.x && snakeY == food.y) {
            score++;
            // Cada celda suma 12V (como un banco de baterías en serie)
            scoreElement.innerHTML = "Voltaje: " + (score * 12) + "V";
            food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
        } else {
            snake.pop();
        }

        let newHead = { x: snakeX, y: snakeY };

        // Game Over por choque interno
        if(collision(newHead, snake)) {
            alert("¡Cortocircuito interno! Voltaje final: " + (score * 12) + "V");
            location.reload();
        }

        snake.unshift(newHead);
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    setInterval(draw, gameSpeed);
</script>
</body>
</html>
