<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASLAEA - Carga de Batería</title>
    <style>
        body { background: #001220; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { border: 4px solid #f97316; background: #000; box-shadow: 0 0 30px rgba(249, 115, 22, 0.2); border-radius: 15px; }
        h1 { color: #f97316; margin-bottom: 5px; font-style: italic; text-transform: uppercase; letter-spacing: 2px; }
        .score { font-size: 24px; font-weight: 900; margin-bottom: 10px; color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
        .btn-volver { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-size: 10px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
        .btn-volver:hover { background: #f97316; border-color: #f97316; }
    </style>
</head>
<body>
    <a href="juegos.html" class="btn-volver">← VOLVER AL RECREO</a>
    <h1>CARGA DE BATERÍA</h1>
    <div class="score" id="scoreVal">Voltaje: 0V</div>
    <canvas id="snakeGame"></canvas>

<script>
    const canvas = document.getElementById("snakeGame");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("scoreVal");

    const logo = new Image();
    logo.src = "logo.png";

    const box = 20;
    canvas.width = 400; 
    canvas.height = 400;

    let snake = [{ x: 10 * box, y: 10 * box }];
    let food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
    let d = "RIGHT";
    let score = 0;
    let gameSpeed = 130; 

    // Control por teclado
    document.addEventListener("keydown", direction);
    function direction(event) {
        if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(event.keyCode == 38 && d != "DOWN") d = "UP";
        else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(event.keyCode == 40 && d != "UP") d = "DOWN";
    }

    function draw() {
        // 1. Fondo Azul TRASLAEA
        ctx.fillStyle = "#001b3a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. LOGO CIRCULAR (Marca de agua) - MANTENIDO
        ctx.save();
        ctx.globalAlpha = 0.15;
        ctx.beginPath();
        ctx.arc(200, 200, 120, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(logo, 80, 80, 240, 240);
        ctx.restore();

        // 3. Dibujar Flujo (Culebra Batería)
        for(let i = 0; i < snake.length; i++) {
            // Cabeza naranja, cuerpo verde con brillo de batería
            ctx.fillStyle = (i == 0) ? "#f97316" : "#4ade80";
            ctx.shadowBlur = (i == 0) ? 15 : 0;
            ctx.shadowColor = "#f97316";
            
            // Dibujamos rectángulos redondeados pequeños para que parezcan celdas
            ctx.fillRect(snake[i].x + 1, snake[i].y + 1, box - 3, box - 3);
            ctx.shadowBlur = 0; // Reset para el resto
        }

        // 4. Comida (Rayo de carga ⚡)
        ctx.font = "20px Arial";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#fff";
        ctx.fillText("⚡", food.x + 2, food.y + 18);
        ctx.shadowBlur = 0;

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if( d == "LEFT") snakeX -= box;
        if( d == "UP") snakeY -= box;
        if( d == "RIGHT") snakeX += box;
        if( d == "DOWN") snakeY += box;

        // --- EFECTO TÚNEL ---
        if (snakeX < 0) snakeX = canvas.width - box;
        else if (snakeX >= canvas.width) snakeX = 0;
        if (snakeY < 0) snakeY = canvas.height - box;
        else if (snakeY >= canvas.height) snakeY = 0;

        // Lógica de Alimentación (Carga)
        if(snakeX == food.x && snakeY == food.y) {
            score++;
            scoreElement.innerHTML = "Voltaje: " + (score * 12) + "V";
            food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
        } else {
            snake.pop();
        }

        let newHead = { x: snakeX, y: snakeY };

        // Game Over solo por colisión interna
        if(collision(newHead, snake)) {
            alert("⚠️ ¡CORTOCIRCUITO! ⚠️\nVoltaje alcanzado: " + (score * 12) + "V");
            location.reload();
        }

        snake.unshift(newHead);
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    setInterval(draw, gameSpeed);
</script>
</body>
</html>
