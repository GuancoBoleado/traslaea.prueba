<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASLAEA - Snake Técnico</title>
    <style>
        body { background: #001b3a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { border: 4px solid #f97316; background: #000; box-shadow: 0 0 30px rgba(0,0,0,0.5); border-radius: 10px; }
        h1 { color: #f97316; margin-bottom: 10px; font-style: italic; }
        .score { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .btn-volver { position: absolute; top: 20px; left: 20px; background: #f97316; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <a href="index.html" class="btn-volver">← VOLVER</a>
    <h1>SNAKE ELÉCTRICO</h1>
    <div class="score" id="scoreVal">Voltaje: 0V</div>
    <canvas id="snakeGame"></canvas>

<script>
    const canvas = document.getElementById("snakeGame");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("scoreVal");

    const logo = new Image();
    logo.src = "logo.png";

    const box = 20;
    canvas.width = 400; 
    canvas.height = 400;

    let snake = [{ x: 9 * box, y: 10 * box }];
    let food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
    let d;
    let score = 0;

    document.addEventListener("keydown", direction);
    function direction(event) {
        if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(event.keyCode == 38 && d != "DOWN") d = "UP";
        else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(event.keyCode == 40 && d != "UP") d = "DOWN";
    }

    // Controles táctiles básicos
    let touchStartX = 0; let touchStartY = 0;
    canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; });
    canvas.addEventListener('touchend', e => {
        let dx = e.changedTouches[0].clientX - touchStartX;
        let dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) { d = dx > 0 ? (d != "LEFT" ? "RIGHT" : d) : (d != "RIGHT" ? "LEFT" : d); }
        else { d = dy > 0 ? (d != "UP" ? "DOWN" : d) : (d != "DOWN" ? "UP" : d); }
    });

    function draw() {
        // Fondo
        ctx.fillStyle = "#002855";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Logo Marca de Agua
        ctx.save(); ctx.globalAlpha = 0.15;
        ctx.drawImage(logo, 100, 100, 200, 200);
        ctx.restore();

        for(let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? "#f97316" : "white";
            ctx.fillRect(snake[i].x, snake[i].y, box, box);
            ctx.strokeStyle = "#002855";
            ctx.strokeRect(snake[i].x, snake[i].y, box, box);
        }

        // Comida (El Rayo)
        ctx.fillStyle = "#FFD700";
        ctx.font = "20px Arial";
        ctx.fillText("⚡", food.x, food.y + box);

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if( d == "LEFT") snakeX -= box;
        if( d == "UP") snakeY -= box;
        if( d == "RIGHT") snakeX += box;
        if( d == "DOWN") snakeY += box;

        if(snakeX == food.x && snakeY == food.y) {
            score++;
            scoreElement.innerHTML = "Voltaje: " + (score * 10) + "V";
            food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
        } else {
            snake.pop();
        }

        let newHead = { x: snakeX, y: snakeY };

        // Game Over
        if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
            clearInterval(game);
            alert("¡Cortocircuito! Voltaje alcanzado: " + (score * 10) + "V");
            location.reload();
        }

        snake.unshift(newHead);
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    let game = setInterval(draw, 100);
</script>
</body>
</html>
