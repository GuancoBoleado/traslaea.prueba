<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #001220; color: white; font-family: 'Inter', sans-serif; }
        .row-morosa { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.05); }
        .row-al-dia { border-left: 4px solid #22c55e; background: rgba(34, 197, 94, 0.05); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-orange-500 italic uppercase">Planilla Contable</h1>
                <p class="text-blue-300 text-[10px] tracking-[0.3em] uppercase opacity-60">Control de Socios y Cuotas</p>
            </div>
            <div class="flex gap-3">
                <button class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-xs font-bold transition">Descargar Reporte</button>
                <button class="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded-lg text-xs font-bold transition">+ Nuevo Asociado</button>
            </div>
        </div>

        <div class="relative mb-6">
            <span class="absolute inset-y-0 left-4 flex items-center opacity-40">🔍</span>
            <input type="text" id="buscador" placeholder="Buscar por Nombre, DNI o Correo..." 
                   class="w-full bg-white/5 border border-white/10 p-4 pl-12 rounded-2xl outline-none focus:border-orange-500/50 transition">
        </div>

        <div class="bg-white/5 border border-white/10 rounded-3xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-white/5 text-[10px] uppercase tracking-widest text-blue-300">
                    <tr>
                        <th class="p-5">Asociado</th>
                        <th class="p-5">DNI</th>
                        <th class="p-5">Estado / Almanaque</th>
                        <th class="p-5 text-right">Acción</th>
                    </tr>
                </thead>
                <tbody id="lista-asociados">
                    <tr class="row-al-dia border-b border-white/5">
                        <td class="p-5">
                            <p class="font-bold">Esteban Colombo</p>
                            <p class="text-[10px] opacity-50">esteban@ejemplo.com</p>
                        </td>
                        <td class="p-5 font-mono text-sm">30.123.456</td>
                        <td class="p-5">
                            <span class="bg-green-500/20 text-green-400 text-[9px] font-black px-2 py-1 rounded">AL DÍA (3 MESES)</span>
                        </td>
                        <td class="p-5 text-right">
                            <button class="text-xs bg-white/10 px-3 py-1 rounded hover:bg-white/20">Ver Pagos</button>
                        </td>
                    </tr>
                    
                    <tr class="row-morosa border-b border-white/5">
                        <td class="p-5">
                            <p class="font-bold">Juan Perez</p>
                            <p class="text-[10px] opacity-50">perez@ejemplo.com</p>
                        </td>
                        <td class="p-5 font-mono text-sm">25.444.888</td>
                        <td class="p-5">
                            <span class="bg-red-500/20 text-red-400 text-[9px] font-black px-2 py-1 rounded">DEUDA (2 MESES)</span>
                        </td>
                        <td class="p-5 text-right flex justify-end gap-2">
                            <button class="text-[9px] bg-blue-500 hover:bg-blue-600 px-3 py-1 rounded font-bold uppercase">📩 Mail</button>
                            <button class="text-xs bg-white/10 px-3 py-1 rounded hover:bg-white/20">Ver Pagos</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<script type="module">
    import { supabase } from './base-de-datos.js';

    const buscador = document.getElementById('buscador');
    const lista = document.getElementById('lista-asociados');

    // Función para obtener los datos y renderizar
    async function cargarAsociados(filtro = "") {
        // Traemos asociados y sus pagos (un "join" de SQL automático)
        let { data: asociados, error } = await supabase
            .from('asociados')
            .select('*, pagos(mes_abonado, anio_abonado)');

        if (error) return console.error(error);

        // Filtrar si el contador escribe algo
        const filtrados = asociados.filter(s => 
            s.nombre.toLowerCase().includes(filtro.toLowerCase()) || 
            s.apellido.toLowerCase().includes(filtro.toLowerCase()) ||
            s.dni.includes(filtro)
        );

        lista.innerHTML = "";

        filtrados.forEach(socio => {
            // Lógica de color: Si tiene 3 o más pagos registrados
            const cantPagos = socio.pagos ? socio.pagos.length : 0;
            const esVerde = cantPagos >= 3;
            
            const tr = document.createElement('tr');
            tr.className = `border-b border-white/5 ${esVerde ? 'row-al-dia' : 'row-morosa'}`;
            
            tr.innerHTML = `
                <td class="p-5">
                    <p class="font-bold">${socio.nombre} ${socio.apellido}</p>
                    <p class="text-[10px] opacity-50">${socio.correo}</p>
                </td>
                <td class="p-5 font-mono text-sm">${socio.dni}</td>
                <td class="p-5">
                    <span class="px-2 py-1 rounded text-[9px] font-black uppercase ${esVerde ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                        ${esVerde ? 'AL DÍA (3+)' : 'DEUDA / PENDIENTE'}
                    </span>
                </td>
                <td class="p-5 text-right">
                    ${!esVerde ? `<button onclick="alert('Enviando mail a ${socio.correo}...') " class="bg-blue-500 hover:bg-blue-600 px-3 py-1 rounded text-[9px] font-bold uppercase">📩 Mail</button>` : ''}
                    <button class="text-xs bg-white/10 px-3 py-1 rounded hover:bg-white/20 ml-2">Detalles</button>
                </td>
            `;
            lista.appendChild(tr);
        });
    }

    // Escuchar el buscador
    buscador.addEventListener('input', (e) => cargarAsociados(e.target.value));

    // Carga inicial
    cargarAsociados();
</script>
</body>
</html>
