<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Asociado • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #001220; }
    </style>
</head>
<body class="text-white p-6">

    <div class="max-w-2xl mx-auto mt-10">
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-black text-orange-500 italic uppercase">Alta de Socio</h1>
                <p class="text-blue-300 text-[10px] tracking-[0.3em] uppercase opacity-60">Registro en Base de Datos</p>
            </div>
            <a href="panel_contador.html" class="text-xs bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg transition border border-white/10">
                Volver al Panel
            </a>
        </div>

        <form id="formNuevoSocio" class="bg-white/5 border border-white/10 p-8 rounded-[2.5rem] shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2">Nombre</label>
                    <input type="text" id="nombre" required class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-orange-500 outline-none transition">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2">Apellido</label>
                    <input type="text" id="apellido" required class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-orange-500 outline-none transition">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2">DNI (Sin puntos)</label>
                    <input type="text" id="dni" required class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-orange-500 outline-none transition">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2">Correo Electrónico</label>
                    <input type="email" id="correo" required class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-orange-500 outline-none transition">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2">Teléfono</label>
                    <input type="text" id="telefono" class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-orange-500 outline-none transition">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2">Fecha de Nacimiento</label>
                    <input type="date" id="fecha_nacimiento" class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-orange-500 outline-none transition text-gray-400">
                </div>

                <div class="flex flex-col gap-2 md:col-span-2">
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2">Dirección</label>
                    <input type="text" id="direccion" class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-orange-500 outline-none transition">
                </div>
            </div>

            <button type="submit" id="btnGuardar" class="w-full mt-8 bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest transition-all shadow-lg shadow-orange-500/20">
                Registrar Asociado
            </button>
        </form>
    </div>

    <script type="module">
        import { supabase } from './config.js';

        const form = document.getElementById('formNuevoSocio');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.innerText = "GUARDANDO...";
            btn.disabled = true;

            const nuevoSocio = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                dni: document.getElementById('dni').value,
                correo: document.getElementById('correo').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                fecha_nacimiento: document.getElementById('fecha_nacimiento').value
            };

            const { data, error } = await supabase
                .from('asociados')
                .insert([nuevoSocio]);

            if (error) {
                alert("Error: " + error.message);
                btn.innerText = "REGISTRAR ASOCIADO";
                btn.disabled = false;
            } else {
                alert("¡Socio registrado con éxito!");
                window.location.href = 'panel_contador.html';
            }
        });
    </script>
</body>
</html>
