<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRASLAEA - Asociación de Electricistas de Traslasierra</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 1. ANIMACIÓN DE FONDOS (Las 3 imágenes en cuadrícula) */
        .bg-images-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #1a1a1a;
            overflow: hidden;
        }
        
        .bg-images-container img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            opacity: 0; /* Empieza invisible para la animación */
            filter: blur(2px) sepia(60%) brightness(0.8) contrast(110%);
            animation: aparecerFondo 4s ease-in-out forwards;
        }

        @keyframes aparecerFondo {
            0% {
                opacity: 0;
                filter: blur(0px) sepia(0%) brightness(100%);
                transform: scale(1.1);
            }
            30% {
                opacity: 1;
                filter: blur(0px) sepia(0%);
            }
            100% {
                opacity: 0.75; 
                filter: blur(2px) sepia(60%) brightness(100%) contrast(110%);
                transform: scale(1);
            }
        }

        /* Responsivo para celulares: fotos una debajo de otra */
        @media (max-width: 768px) {
            .bg-images-container {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, 1fr);
            }
            .bg-images-container img {
                height: 33.33vh;
            }
        }

        /* 2. EFECTOS ESPECIALES DE DISEÑO */
        .glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Estilo para el mapa y que no tape el menú */
        #mapa-socios { 
            z-index: 10; 
            border-radius: 1rem;
            height: 350px;
        }

        /* Animación suave para el hover del logo */
        .logo-container:hover img {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="font-sans text-gray-900 relative">

    <div class="bg-images-container">
        <img src="imagen1.jpg" alt="Obra 1" style="animation-delay: 0s;">
        <img src="imagen2.jpg" alt="Obra 2" style="animation-delay: 0.3s;">
        <img src="imagen3.jpg" alt="Obra 3" style="animation-delay: 0.6s;">
    </div>
