<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tensión Crítica • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000814; margin: 0; overflow: hidden; touch-action: none; font-family: 'Inter', sans-serif; }
        canvas { display: block; filter: contrast(1.2); }
        #ui { position: absolute; top: 20px; width: 100%; pointer-events: none; display: flex; justify-content: space-around; z-index: 50; }
        .label { color: #f97316; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
        .val { color: #fff; font-size: 24px; }
    </style>
</head>
<body>

    <a href="juegos.html" style="position: absolute; top: 20px; left: 20px; z-index: 100; background: #f97316; color: white; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-size: 10px; font-weight: 900; border: 2px solid rgba(255,255,255,0.2);">← SALIR</a>

    <div id="ui">
        <div class="text-center"><div class="label">Amperaje</div><div class="val" id="score">0</div></div>
        <div class="text-center"><div class="label">Aislación</div><div class="val" id="lives" style="color: #ef4444;">100%</div></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let lives = 100;
        let objects = [];
        let particles = [];
        let isDrawing = false;
        let trail = [];

        const techItems = [
            { txt: '🔌', isDanger: false, pts: 10, msg: 'Cable Pelado' },
            { txt: '🪫', isDanger: false, pts: 20, msg: 'Batería' },
            { txt: '💡', isDanger: false, pts: 15, msg: 'Luz' },
            { txt: '📟', isDanger: true, pts: -30, msg: '¡TESTER!' },
            { txt: '⚠️', isDanger: true, pts: -20, msg: '¡ALTA TENSIÓN!' }
        ];

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.color = color;
                this.alpha = 1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Item {
            constructor() {
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = canvas.height + 50;
                this.speedY = -(Math.random() * 6 + 14);
                this.speedX = (Math.random() - 0.5) * 5;
                this.data = techItems[Math.floor(Math.random() * techItems.length)];
                this.angle = 0;
                this.spin = (Math.random() - 0.5) * 0.1;
            }
            update() {
                this.y += this.speedY; this.x += this.speedX;
                this.speedY += 0.25; this.angle += this.spin;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.font = "50px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                // Brillo si es peligroso
                if(this.data.isDanger) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "red";
                }
                ctx.fillText(this.data.txt, 0, 0);
                ctx.restore();
            }
        }

        function animate() {
            // Fondo con rastro
            ctx.fillStyle = 'rgba(0, 8, 20, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar rastro del dedo/mouse (El "Corte")
            if (trail.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
                ctx.stroke();
                if(trail.length > 10) trail.shift();
            }

            if (Math.random() < 0.04) objects.push(new Item());

            objects.forEach((obj, i) => {
                obj.update();
                obj.draw();

                // Verificar colisión con el rastro
                if (isDrawing && trail.length > 0) {
                    let d = Math.hypot(obj.x - trail[trail.length-1].x, obj.y - trail[trail.length-1].y);
                    if (d < 40) {
                        // Chispas
                        for(let p=0; p<15; p++) particles.push(new Particle(obj.x, obj.y, obj.data.isDanger ? '#ff0000' : '#f97316'));
                        
                        if (obj.data.isDanger) {
                            lives -= 20;
                            livesEl.innerText = lives + "%";
                        } else {
                            score += obj.data.pts;
                            scoreEl.innerText = score;
                        }
                        objects.splice(i, 1);
                        if(lives <= 0) {
                            alert("¡FALLA DE AISLACIÓN! Cortocircuito total.");
                            location.reload();
                        }
                    }
                }
                if (obj.y > canvas.height + 100) objects.splice(i, 1);
            });

            particles.forEach((p, i) => {
                p.update(); p.draw();
                if(p.alpha <= 0) particles.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }

        const handleMove = (e) => {
            let x = (e.touches ? e.touches[0].clientX : e.clientX);
            let y = (e.touches ? e.touches[0].clientY : e.clientY);
            if(isDrawing) trail.push({x, y});
            else trail = [];
        };

        window.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => { isDrawing = false; trail = []; });
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchstart', (e) => { isDrawing = true; handleMove(e); });
        window.addEventListener('touchend', () => { isDrawing = false; trail = []; });
        window.addEventListener('touchmove', handleMove);

        animate();
    </script>
</body>
</html>
