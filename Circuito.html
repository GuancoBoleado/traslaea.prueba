<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zapatilla al Límite PRO • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000c1a; touch-action: none; user-select: none; font-family: sans-serif; overflow: hidden; }
        
        /* Zapatilla Realista */
        .zapatilla-body {
            background: #ffffff; border-radius: 60px; height: 100px; width: 100%; max-width: 450px;
            display: flex; align-items: center; justify-content: space-around; padding: 0 30px;
            box-shadow: 0 10px 0 #cbd5e1, 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #e2e8f0;
            position: relative; z-index: 20;
        }

        .toma-real {
            width: 55px; height: 55px; background: #f8fafc; border-radius: 50%;
            border: 2px solid #e2e8f0; position: relative; display: flex; align-items: center; justify-content: center;
        }

        .patitas { width: 25px; height: 25px; position: relative; transform: rotate(180deg); opacity: 0.3; }
        .patitas::before, .patitas::after { content: ''; position: absolute; width: 3px; height: 10px; background: #334155; border-radius: 2px; }
        .patitas::before { left: 3px; top: 2px; transform: rotate(30deg); }
        .patitas::after { right: 3px; top: 2px; transform: rotate(-30deg); }
        .tierra { position: absolute; width: 3px; height: 10px; background: #334155; bottom: 1px; left: 11px; border-radius: 2px; }

        /* Capa de Cables y Chispas */
        #cableCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }

        .sobrecarga { animation: vibrar 0.1s infinite; background: #fee2e2 !important; }
        @keyframes vibrar { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

        .aparato-card { transition: all 0.3s; cursor: pointer; z-index: 30; background: rgba(255,255,255,0.05); }
        .activo { border-color: #f97316 !important; box-shadow: 0 0 15px rgba(249,115,22,0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 text-white">

    <canvas id="cableCanvas"></canvas>

    <a href="juegos.html" class="self-start mb-4 bg-orange-600 text-white px-5 py-2 rounded-full font-black text-xs shadow-lg uppercase z-50">← VOLVER</a>

    <div class="text-center mb-4 z-20">
        <h1 class="text-2xl font-black italic text-orange-500 uppercase leading-none">Zapatilla al Límite</h1>
        <p class="text-blue-300 text-[9px] font-bold tracking-[0.4em] mt-1 opacity-70">SISTEMA DE PROTECCIÓN TÉCNICA</p>
    </div>

    <div class="w-full max-w-xs bg-black/60 p-4 rounded-3xl mb-6 border border-white/10 text-center z-20">
        <div class="flex justify-between items-center px-2">
            <span id="amp-display" class="text-4xl font-black text-green-400">0.0<small class="text-lg">A</small></span>
            <div class="text-right">
                <div class="text-[8px] font-black uppercase text-blue-400">Carga Actual</div>
                <div class="w-24 bg-gray-800 h-2 rounded-full mt-1 overflow-hidden">
                    <div id="amp-bar" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="zapatilla-ui" class="zapatilla-body">
        <div class="toma-real" id="toma-0"><div class="patitas"><div class="tierra"></div></div></div>
        <div class="toma-real" id="toma-1"><div class="patitas"><div class="tierra"></div></div></div>
        <div class="toma-real" id="toma-2"><div class="patitas"><div class="tierra"></div></div></div>
        <div class="toma-real" id="toma-3"><div class="patitas"><div class="tierra"></div></div></div>
    </div>

    <div class="grid grid-cols-3 gap-3 w-full max-w-sm mt-24" id="items-container"></div>

    <script>
        const canvas = document.getElementById('cableCanvas');
        const ctx = canvas.getContext('2d');
        const ampDisplay = document.getElementById('amp-display');
        const ampBar = document.getElementById('amp-bar');
        const zapatilla = document.getElementById('zapatilla-ui');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let totalAmp = 0;
        let conexiones = []; // Guarda { equipoId, tomaIdx, startX, startY, endX, endY }
        let chispas = [];

        const equipos = [
            { id: 0, nom: 'Pava', amp: 7.0, icon: '☕' },
            { id: 1, nom: 'Estufa', amp: 9.0, icon: '🔥' },
            { id: 2, nom: 'Venti', amp: 4.0, icon: '🌬️' },
            { id: 3, nom: 'Tele', amp: 1.0, icon: '📺' },
            { id: 4, nom: 'Router', amp: 0.5, icon: '📡' },
            { id: 5, nom: 'Celu', amp: 0.2, icon: '📱' }
        ];

        function crearMenu() {
            const container = document.getElementById('items-container');
            equipos.forEach(eq => {
                const card = document.createElement('div');
                card.id = `eq-${eq.id}`;
                card.className = "aparato-card p-3 rounded-2xl flex flex-col items-center border border-white/5";
                card.innerHTML = `
                    <span class="text-3xl">${eq.icon}</span>
                    <span class="text-[10px] font-black text-orange-500">${eq.amp}A</span>
                `;
                card.onclick = () => toggleConexion(eq, card);
                container.appendChild(card);
            });
        }

        function toggleConexion(eq, card) {
            const index = conexiones.findIndex(c => c.equipoId === eq.id);
            
            if (index !== -1) {
                // DESCONECTAR
                totalAmp -= eq.amp;
                conexiones.splice(index, 1);
                card.classList.remove('activo');
            } else {
                // CONECTAR
                if (conexiones.length >= 4) return;
                
                // Buscar toma libre
                const tomaIdx = [0,1,2,3].find(i => !conexiones.some(c => c.tomaIdx === i));
                const tomaRect = document.getElementById(`toma-${tomaIdx}`).getBoundingClientRect();
                const cardRect = card.getBoundingClientRect();

                conexiones.push({
                    equipoId: eq.id,
                    tomaIdx: tomaIdx,
                    startX: cardRect.left + cardRect.width / 2,
                    startY: cardRect.top,
                    endX: tomaRect.left + tomaRect.width / 2,
                    endY: tomaRect.top + tomaRect.height / 2
                });

                totalAmp += eq.amp;
                card.classList.add('activo');
                crearChisporroteo(tomaRect.left + tomaRect.width / 2, tomaRect.top + tomaRect.height / 2);
            }
            actualizarUI();
            if (totalAmp > 10) setTimeout(explotar, 300);
        }

        function crearChisporroteo(x, y) {
            for(let i=0; i<20; i++) {
                chispas.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#f97316' : '#60a5fa'
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar Cables (Curvas de Bezier)
            conexiones.forEach(c => {
                ctx.beginPath();
                ctx.moveTo(c.startX, c.startY);
                // Punto de control para la curva del cable "colgando"
                const cpY = (c.startY + c.endY) / 2 + 50; 
                ctx.quadraticCurveTo((c.startX + c.endX) / 2, cpY, c.endX, c.endY);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                // Alma del cable (detalle gris)
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Dibujar Chispas
            chispas.forEach((p, i) => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fill();
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                if(p.life <= 0) chispas.splice(i, 1);
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(draw);
        }

        function actualizarUI() {
            ampDisplay.innerText = totalAmp.toFixed(1) + "A";
            const p = (totalAmp / 10) * 100;
            ampBar.style.width = Math.min(p, 100) + "%";
            
            if(totalAmp > 10) {
                ampDisplay.className = "text-4xl font-black text-red-500";
                zapatilla.classList.add('sobrecarga');
            } else {
                ampDisplay.className = "text-4xl font-black text-green-400";
                zapatilla.classList.remove('sobrecarga');
            }
        }

        function explotar() {
            alert("💥 ¡BOOM! SOBRECARGA ELÉCTRICA.\nConectaste " + totalAmp.toFixed(1) + "A.");
            location.reload();
        }

        crearMenu();
        draw();
    </script>
</body>
</html>
