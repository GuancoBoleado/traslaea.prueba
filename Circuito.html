<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zapatilla al Límite • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #010c1a; touch-action: none; user-select: none; font-family: sans-serif; overflow: hidden; }
        .aparato { cursor: grab; transition: transform 0.2s; }
        .aparato:active { cursor: grabbing; scale: 1.1; }
        .zapatilla { background: #e2e8f0; border-radius: 20px; box-shadow: 0 10px 0 #cbd5e1; }
        .toma { background: #94a3b8; border-radius: 50%; width: 40px; height: 40px; margin: 10px; border: 3px inset rgba(0,0,0,0.2); }
        .sobrecarga { animation: shake 0.2s infinite, glow 0.5s infinite alternate; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }
        @keyframes glow { from { background: #e2e8f0; } to { background: #ef4444; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 text-white">

    <a href="juegos.html" class="self-start mb-4 bg-orange-500 text-white px-4 py-2 rounded-lg font-bold text-xs shadow-lg">← VOLVER</a>

    <div class="text-center mb-6">
        <h1 class="text-3xl font-black italic text-orange-500 uppercase leading-none">Zapatilla al Límite</h1>
        <p class="text-blue-300 text-[10px] font-bold tracking-widest mt-1">NO PASES LOS 10 AMPERES</p>
    </div>

    <div class="w-full max-w-xs bg-white/10 p-4 rounded-2xl mb-6 border border-white/10 text-center">
        <div class="text-xs uppercase opacity-50 font-bold mb-1">Consumo Actual</div>
        <div id="amp-display" class="text-5xl font-black text-green-400">0.0<span class="text-xl">A</span></div>
        <div class="w-full bg-gray-700 h-2 mt-3 rounded-full overflow-hidden">
            <div id="amp-bar" class="bg-green-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>

    <div id="zapatilla-ui" class="zapatilla w-full max-w-sm p-4 flex justify-around items-center mb-10 border-4 border-white/20">
        <div class="toma flex items-center justify-center text-[8px] text-black/20 font-bold">I I</div>
        <div class="toma flex items-center justify-center text-[8px] text-black/20 font-bold">I I</div>
        <div class="toma flex items-center justify-center text-[8px] text-black/20 font-bold">I I</div>
        <div class="toma flex items-center justify-center text-[8px] text-black/20 font-bold">I I</div>
        <div class="toma flex items-center justify-center text-[8px] text-black/20 font-bold">I I</div>
    </div>

    <div class="grid grid-cols-3 gap-4 w-full max-w-xs" id="items-container">
        </div>

    <script>
        const ampDisplay = document.getElementById('amp-display');
        const ampBar = document.getElementById('amp-bar');
        const zapatilla = document.getElementById('zapatilla-ui');
        const container = document.getElementById('items-container');

        let totalAmp = 0;
        const maxAmp = 10;

        const productos = [
            { id: 1, nombre: 'Pava', amp: 7.0, icon: '☕' },
            { id: 2, nombre: 'Tele', amp: 1.0, icon: '📺' },
            { id: 3, nombre: 'Router', amp: 0.5, icon: '📡' },
            { id: 4, nombre: 'Estufa', amp: 9.0, icon: '🔥' },
            { id: 5, nombre: 'Celu', amp: 0.2, icon: '📱' },
            { id: 6, nombre: 'Venti', amp: 4.0, icon: '🌬️' }
        ];

        function init() {
            productos.forEach(p => {
                const btn = document.createElement('button');
                btn.className = "aparato bg-white/5 border border-white/10 p-3 rounded-xl flex flex-col items-center active:bg-orange-500/20";
                btn.innerHTML = `
                    <span class="text-3xl mb-1">${p.icon}</span>
                    <span class="text-[10px] font-bold">${p.nombre}</span>
                    <span class="text-[12px] text-orange-400 font-black">${p.amp}A</span>
                `;
                btn.onclick = () => enchufar(p, btn);
                container.appendChild(btn);
            });
        }

        function enchufar(p, elemento) {
            if (elemento.classList.contains('opacity-20')) return; // Ya está enchufado

            totalAmp += p.amp;
            elemento.classList.add('opacity-20'); // Marcar como usado
            actualizarUI();

            if (totalAmp > maxAmp) {
                explotar();
            }
        }

        function actualizarUI() {
            ampDisplay.innerText = totalAmp.toFixed(1) + "A";
            const porc = (totalAmp / maxAmp) * 100;
            ampBar.style.width = Math.min(porc, 100) + "%";

            if (totalAmp > 8) {
                ampDisplay.className = "text-5xl font-black text-red-500";
                ampBar.className = "bg-red-500 h-full transition-all";
                zapatilla.classList.add('sobrecarga');
            } else {
                ampDisplay.className = "text-5xl font-black text-green-400";
                ampBar.className = "bg-green-500 h-full transition-all";
                zapatilla.classList.remove('sobrecarga');
            }
        }

        function explotar() {
            zapatilla.style.background = "#000";
            document.body.style.background = "#f00";
            setTimeout(() => {
                alert("💥 ¡BOOM! SOBRECARGA ELÉCTRICA.\nConectaste " + totalAmp.toFixed(1) + "A y la zapatilla aguantaba 10A.\n\nEvitá conectar estufas o pavas en prolongadores.");
                location.reload();
            }, 100);
        }

        init();
    </script>
</body>
</html>
