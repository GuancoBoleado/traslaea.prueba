<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Corte de Fase • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000c18; margin: 0; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; width: 100%; pointer-events: none; display: flex; justify-content: space-between; padding: 0 30px; }
        .stat { color: #f97316; font-weight: 900; font-size: 20px; text-transform: uppercase; font-style: italic; }
    </style>
</head>
<body>

    <a href="juegos.html" style="position: absolute; top: 20px; left: 20px; z-index: 100; background: #f97316; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 12px; font-weight: bold;">← VOLVER</a>

    <div id="ui">
        <div class="stat">Cables: <span id="score">0</span></div>
        <div class="stat" style="color: #ef4444;">Vidas: <span id="lives">3</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let lives = 3;
        let particles = [];
        let objects = [];
        let isDrawing = false;
        let lastMouse = { x: 0, y: 0 };

        const types = [
            { txt: '🔌', isBomb: false, label: 'Cable' },
            { txt: '➰', isBomb: false, label: 'Chicote' },
            { txt: '⚡', isBomb: false, label: 'Fase' },
            { txt: '📟', isBomb: true, label: 'Multímetro' }, // ¡NO CORTAR!
            { txt: '⏹️', isBomb: true, label: 'Térmica' }      // ¡NO CORTAR!
        ];

        class TechObject {
            constructor() {
                this.x = Math.random() * (canvas.width - 50) + 25;
                this.y = canvas.height + 50;
                this.speedY = -(Math.random() * 5 + 12);
                this.speedX = (Math.random() - 0.5) * 4;
                this.type = types[Math.floor(Math.random() * types.length)];
                this.radius = 30;
                this.cut = false;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.speedY += 0.2; // Gravedad
            }
            draw() {
                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.fillText(this.type.txt, this.x, this.y);
            }
        }

        function spawn() {
            if (Math.random() < 0.03) objects.push(new TechObject());
        }

        function checkCut(x1, y1, x2, y2) {
            objects.forEach((obj, index) => {
                if (!obj.cut) {
                    let d = distToSegment({x: obj.x, y: obj.y}, {x: x1, y: y1}, {x: x2, y: y2});
                    if (d < obj.radius) {
                        obj.cut = true;
                        if (obj.type.isBomb) {
                            lives--;
                            livesEl.innerText = lives;
                            if (lives <= 0) {
                                alert("¡DESASTRE TÉCNICO! Rompiste las herramientas. Cables cortados: " + score);
                                location.reload();
                            }
                        } else {
                            score++;
                            scoreEl.innerText = score;
                        }
                        objects.splice(index, 1);
                    }
                }
            });
        }

        function distToSegment(p, v, w) {
            let l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
            if (l2 == 0) return Math.sqrt(Math.pow(p.x - v.x, 2) + Math.pow(p.y - v.y, 2));
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt(Math.pow(p.x - (v.x + t * (w.x - v.x)), 2) + Math.pow(p.y - (v.y + t * (w.y - v.y)), 2));
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 12, 24, 0.3)'; // Efecto estela
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            spawn();
            
            objects.forEach((obj, i) => {
                obj.update();
                obj.draw();
                if (obj.y > canvas.height + 100) objects.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }

        // Eventos Táctiles y Mouse
        const handleMove = (e) => {
            let x = e.touches ? e.touches[0].clientX : e.clientX;
            let y = e.touches ? e.touches[0].clientY : e.clientY;
            
            if (isDrawing) {
                ctx.beginPath();
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 4;
                ctx.moveTo(lastMouse.x, lastMouse.y);
                ctx.lineTo(x, y);
                ctx.stroke();
                checkCut(lastMouse.x, lastMouse.y, x, y);
            }
            lastMouse = { x, y };
        };

        window.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchstart', () => isDrawing = true);
        window.addEventListener('touchend', () => isDrawing = false);
        window.addEventListener('touchmove', handleMove);

        animate();
    </script>
</body>
</html>
