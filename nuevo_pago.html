<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pago • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #001220; }
    </style>
</head>
<body class="text-white p-6">

    <div class="max-w-lg mx-auto mt-10">
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-black text-green-500 italic uppercase">Cargar Pago</h1>
                <p class="text-blue-300 text-[10px] tracking-[0.3em] uppercase opacity-60">Registro de Cuota Mensual</p>
            </div>
            <a href="panel_contador.html" class="text-xs bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg transition border border-white/10">
                Volver
            </a>
        </div>

        <form id="formNuevoPago" class="bg-white/5 border border-white/10 p-8 rounded-[2.5rem] shadow-2xl">
            <div class="flex flex-col gap-6">
                
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase font-bold text-green-500/50 ml-2">Seleccionar Asociado</label>
                    <select id="asociado_id" required class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-green-500 outline-none transition text-white">
                        <option value="">Cargando asociados...</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] uppercase font-bold text-green-500/50 ml-2">Mes</label>
                        <select id="mes_abonado" required class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-green-500 outline-none transition">
                            <option value="1">Enero</option>
                            <option value="2">Febrero</option>
                            <option value="3">Marzo</option>
                            <option value="4">Abril</option>
                            <option value="5">Mayo</option>
                            <option value="6">Junio</option>
                            <option value="7">Julio</option>
                            <option value="8">Agosto</option>
                            <option value="9">Septiembre</option>
                            <option value="10">Octubre</option>
                            <option value="11">Noviembre</option>
                            <option value="12">Diciembre</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] uppercase font-bold text-green-500/50 ml-2">Año</label>
                        <input type="number" id="anio_abonado" value="2026" class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-green-500 outline-none transition">
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase font-bold text-green-500/50 ml-2">Monto ($)</label>
                    <input type="number" id="monto_pagado" placeholder="0.00" class="bg-[#001220] border border-white/10 p-3 rounded-xl focus:border-green-500 outline-none transition">
                </div>

                <button type="submit" id="btnGuardar" class="w-full mt-4 bg-green-500 hover:bg-green-600 text-[#001220] font-black py-4 rounded-2xl uppercase tracking-widest transition-all shadow-lg shadow-green-500/20">
                    Confirmar Pago
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { supabase } from './base-de-datos.js';

        const selectSocio = document.getElementById('asociado_id');
        const form = document.getElementById('formNuevoPago');

        // 1. Cargar la lista de socios al entrar
        async function obtenerSocios() {
            const { data, error } = await supabase
                .from('asociados')
                .select('id, nombre, apellido')
                .order('apellido', { ascending: true });

            if (data) {
                selectSocio.innerHTML = '<option value="">-- Elegir Técnico --</option>';
                data.forEach(s => {
                    selectSocio.innerHTML += `<option value="${s.id}">${s.apellido}, ${s.nombre}</option>`;
                });
            }
        }

        // 2. Guardar el pago
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.innerText = "PROCESANDO...";
            btn.disabled = true;

            const nuevoPago = {
                asociado_id: document.getElementById('asociado_id').value,
                mes_abonado: parseInt(document.getElementById('mes_abonado').value),
                anio_abonado: parseInt(document.getElementById('anio_abonado').value),
                monto_pagado: parseFloat(document.getElementById('monto_pagado').value) || 0,
                metodo_pago: 'No especificado'
            };

            const { error } = await supabase.from('pagos').insert([nuevoPago]);

            if (error) {
                alert("Error: " + error.message);
                btn.innerText = "CONFIRMAR PAGO";
                btn.disabled = false;
            } else {
                alert("¡Pago registrado correctamente!");
                window.location.href = 'panel_contador.html';
            }
        });

        obtenerSocios();
    </script>
</body>
</html>
