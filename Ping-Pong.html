<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASLAEA - Ping Pong</title>
    <style>
        body { 
            background: #001b3a; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: white; 
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        canvas { 
            border: 4px solid #f97316; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8); 
            border-radius: 15px;
        }
        h1 { 
            margin-bottom: 15px; 
            color: #f97316; 
            font-style: italic; 
            font-weight: 900; 
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }
        .btn-volver {
            position: absolute;
            top: 20px; left: 20px;
            background: #f97316;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            box-shadow: 0 4px 0px #c2410c;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-volver">← VOLVER</a>
    <h1>PING PONG TRASLAEA</h1>
    <canvas id="pong"></canvas>

<script>
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext('2d');

    // CARGA DE LOGO
    const logoAsoc = new Image();
    logoAsoc.src = "logo.png"; // Asegurate que el archivo se llame así en tu carpeta

    canvas.width = 800;
    canvas.height = 500;

    // Redimensionar para móviles
    if(window.innerWidth < 800) {
        canvas.style.width = (window.innerWidth - 20) + "px";
        canvas.style.height = "auto";
    }

    const user = { x: 20, y: canvas.height/2 - 50, width: 15, height: 100, score: 0, color: "#FFFFFF" };
    const com = { x: canvas.width - 35, y: canvas.height/2 - 50, width: 15, height: 100, score: 0, color: "#f97316" };
    const ball = { x: canvas.width/2, y: canvas.height/2, radius: 10, speed: 7, velocityX: 7, velocityY: 7, color: "#FFFFFF" };

    // CONTROLES (Mouse, Teclado y Táctil)
    canvas.addEventListener("mousemove", (e) => {
        let rect = canvas.getBoundingClientRect();
        let scaleY = canvas.height / rect.height; 
        user.y = (e.clientY - rect.top) * scaleY - user.height/2;
    });

    window.addEventListener("keydown", (e) => {
        if(e.key === "ArrowUp") user.y -= 50;
        if(e.key === "ArrowDown") user.y += 50;
    });

    canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        let touch = e.touches[0];
        let rect = canvas.getBoundingClientRect();
        let scaleY = canvas.height / rect.height;
        user.y = (touch.clientY - rect.top) * scaleY - user.height/2;
    }, { passive: false });

    function resetBall() {
        ball.x = canvas.width/2;
        ball.y = canvas.height/2;
        ball.speed = 7;
        ball.velocityX = -ball.velocityX;
    }

    function collision(b, p) {
        return b.x + b.radius > p.x && b.x - b.radius < p.x + p.width &&
               b.y + b.radius > p.y && b.y - b.radius < p.y + p.height;
    }

    function update() {
        ball.x += ball.velocityX;
        ball.y += ball.velocityY;

        // IA Computadora
        com.y += (ball.y - (com.y + com.height/2)) * 0.1;

        if(ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
            ball.velocityY = -ball.velocityY;
        }

        let player = (ball.x < canvas.width/2) ? user : com;

        if(collision(ball, player)) {
            let collidePoint = (ball.y - (player.y + player.height/2)) / (player.height/2);
            let angleRad = (Math.PI/4) * collidePoint;
            let direction = (ball.x < canvas.width/2) ? 1 : -1;
            ball.velocityX = direction * ball.speed * Math.cos(angleRad);
            ball.velocityY = ball.speed * Math.sin(angleRad);
            ball.speed += 0.4;
        }

        if(ball.x - ball.radius < 0) { com.score++; resetBall(); }
        else if(ball.x + ball.radius > canvas.width) { user.score++; resetBall(); }

        if(user.y < 0) user.y = 0;
        if(user.y > canvas.height - user.height) user.y = canvas.height - user.height;
    }

    function render() {
        // 1. Fondo Azul
        ctx.fillStyle = "#002855";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. CÍRCULO CENTRAL CON LOGO (Debajo de todo)
        let centerX = canvas.width / 2;
        let centerY = canvas.height / 2;
        let radio = 90;

        ctx.save();
        ctx.globalAlpha = 0.3; // Opacidad marca de agua
        
        // Círculo Naranja
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(centerX, centerY, radio, 0, Math.PI * 2);
        ctx.fill();

        // Recorte para el logo
        ctx.beginPath();
        ctx.arc(centerX, centerY, radio, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(logoAsoc, centerX - radio, centerY - radio, radio * 2, radio * 2);
        ctx.restore();

        // 3. Línea central
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, 0);
        ctx.lineTo(canvas.width/2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // 4. Marcadores (Números grandes)
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.font = "bold 80px Arial";
        ctx.fillText(user.score, canvas.width/4 - 20, 100);
        ctx.fillText(com.score, 3*canvas.width/4 - 20, 100);

        // 5. Jugadores y Pelota (Encima de todo)
        ctx.fillStyle = "white"; // Pelota
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = user.color; // Paleta Humano
        ctx.fillRect(user.x, user.y, user.width, user.height);

        ctx.fillStyle = com.color; // Paleta PC
        ctx.fillRect(com.x, com.y, com.width, com.height);
    }

    setInterval(() => { update(); render(); }, 1000/60);
</script>
</body>
</html>
