            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        .btn-volver:active { transform: translateY(4px); box-shadow: none; }

    canvas.width = 800;

    if(window.innerWidth < 800) {

        canvas.style.height = "auto";

    canvas.addEventListener("mousemove", (e) => {
        let rect = canvas.getBoundingClientRect();
        let scaleY = canvas.height / rect.height; 
        user.y = (e.clientY - rect.top) * scaleY - user.height/2;
    });

    // CONTROL TECLADO (Flechas)
    window.addEventListener("keydown", (e) => {
        if(e.key === "ArrowUp") user.y -= 40;
        if(e.key === "ArrowDown") user.y += 40;
    });

    canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();

        let rect = canvas.getBoundingClientRect();

        user.y = (touch.clientY - rect.top) * scaleY - user.height/2;
    }, { passive: false });
