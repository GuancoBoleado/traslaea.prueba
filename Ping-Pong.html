<!DOCTYPE html>
<html>
<head>
    <title>TRASLAEA - Ping Pong Técnico</title>
    <style>
        body { background: #1a202c; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; flex-direction: column; }
        canvas { border: 4px solid #002855; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); border-radius: 10px; cursor: none; }
        h1 { margin-bottom: 10px; color: #f97316; italic; font-weight: 900; }
    </style>
</head>
<body>
    <h1>PING PONG TRASLAEA</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <p>Mové el mouse para controlar tu paleta</p>

<script>
    // --- 1. CONFIGURACIÓN TÉCNICA (Gabinete) ---
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth > 600 ? 600 : window.innerWidth - 20;
    let height = window.innerHeight > 400 ? 400 : window.innerHeight - 50;
    canvas.width = width;
    canvas.height = height;

    // --- 2. OBJETOS DEL SISTEMA (Componentes) ---
    let score = 0;
    let level = 1;
    let ballHits = 0; 

    const user = {
        x : 10, y : (canvas.height/2) - 50,
        width : 10, height : 100,
        score : 0, color : "#fff" 
    }

    const com = {
        x : canvas.width - 20, y : (canvas.height/2) - 50,
        width : 10, height : 100,
        score : 0, color : "#f97316" 
    }

    const ball = {
        x : canvas.width/2, y : canvas.height/2,
        radius : 8,
        speed : 3, 
        velocityX : 3, velocityY : 3,
        color : "#fff"
    }

    // --- 3. SENSORES DE MOVIMIENTO (Controles) ---

    // A. Sensor Mouse (Compu)
    canvas.addEventListener("mousemove", function(e){
        let rect = canvas.getBoundingClientRect();
        user.y = e.clientY - rect.top - user.height/2;
    });

    // B. Sensor TOUCH (Celular)
    canvas.addEventListener("touchmove", function(e){
        e.preventDefault(); 
        let touch = e.touches[0];
        let rect = canvas.getBoundingClientRect();
        user.y = touch.clientY - rect.top - user.height/2;
    }, { passive: false });

    // C. Sensor TECLADO (Flechas arriba/abajo) - ¡NUEVO!
    window.addEventListener("keydown", function(e){
        const step = 30; // Cuántos píxeles se mueve por cada toque de flecha
        if(e.key === "ArrowUp") {
            user.y -= step;
        } else if(e.key === "ArrowDown") {
            user.y += step;
        }
    });


    // --- 4. LÓGICA DEL MOTOR (Update) ---

    function resetBall(){
        ball.x = canvas.width/2;
        ball.y = canvas.height/2;
        ball.speed = 3 + (level * 0.5); 
        ball.velocityX = -ball.velocityX; 
    }

    function collision(b,p){
        p.top = p.y; p.bottom = p.y + p.height;
        p.left = p.x; p.right = p.x + p.width;
        b.top = b.y - b.radius; b.bottom = b.y + b.radius;
        b.left = b.x - b.radius; b.right = b.x + b.radius;
        return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
    }

    function update(){
        ball.x += ball.velocityX;
        ball.y += ball.velocityY;

        // IA de la computadora
        com.y += ((ball.y - (com.y + com.height/2))) * 0.05;

        if(ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height){
            ball.velocityY = -ball.velocityY;
        }

        let player = (ball.x + ball.radius < canvas.width/2) ? user : com;

        if(collision(ball,player)){
            ballHits++; 
            if(ballHits % 5 === 0){ 
                level++;
                ball.speed += 0.5;
                score += 10; 
            }

            let collidePoint = (ball.y - (player.y + player.height/2));
            collidePoint = collidePoint / (player.height/2);
            let angleRad = (Math.PI/4) * collidePoint;
            let direction = (ball.x + ball.radius < canvas.width/2) ? 1 : -1;
            
            ball.velocityX = direction * ball.speed * Math.cos(angleRad);
            ball.velocityY = ball.speed * Math.sin(angleRad);
        }

        // Límites para que la paleta del usuario no se salga del tablero (útil para teclado)
        if(user.y < 0) user.y = 0;
        if(user.y > canvas.height - user.height) user.y = canvas.height - user.height;

        if( ball.x - ball.radius < 0 ){ com.score++; resetBall(); ballHits = 0; level = 1; score = 0; }
        else if( ball.x + ball.radius > canvas.width ){ user.score++; resetBall(); ballHits = 0; level = 1; score += 5; }
    }

    // --- 5. RENDERIZADO (Dibujo) ---

    function drawRect(x, y, w, h, color){
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
    }

    function drawCircle(x, y, r, color){
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x,y,r,0,Math.PI*2,true);
        ctx.closePath();
        ctx.fill();
    }

    function drawText(text, x, y, color, size="35px"){
        ctx.fillStyle = color;
        ctx.font = size + " 'Roboto', sans-serif";
        ctx.fillText(text, x, y);
    }

    function render(){
        drawRect(0, 0, canvas.width, canvas.height, "#002855");
        drawText(user.score, canvas.width/4, canvas.height/5, "#fff");
        drawText(com.score, 3*canvas.width/4, canvas.height/5, "#f97316");
        drawText("Nivel: " + level, canvas.width/2 - 60, canvas.height - 20, "rgba(255,255,255,0.4)", "15px");
        drawText("Puntos: " + score, canvas.width/2 - 60, canvas.height - 40, "rgba(255,255,255,0.4)", "15px");

        drawRect(user.x, user.y, user.width, user.height, user.color);
        drawRect(com.x, com.y, com.width, com.height, com.color);
        drawCircle(ball.x, ball.y, ball.radius, ball.color);
    }

    function game(){
        update();
        render();
    }
    let loop = setInterval(game, 1000/50);

</script>
</body>
</html>
