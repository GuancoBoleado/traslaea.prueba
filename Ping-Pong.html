<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASLAEA - Ping Pong Técnico</title>
    <style>
        body { 
            background: #1a202c; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: white; 
            font-family: sans-serif; 
            flex-direction: column; 
            overflow: hidden;
        }
        canvas { 
            border: 4px solid #f97316; /* Naranja TRASLAEA */
            background: #000; 
            box-shadow: 0 0 30px rgba(0,0,0,0.7); 
            border-radius: 10px; 
        }
        h1 { margin-bottom: 10px; color: #f97316; font-style: italic; font-weight: 900; text-transform: uppercase; }
        p { margin-top: 10px; opacity: 0.5; font-size: 12px; }
    </style>
</head>
<body>
    <h1>PING PONG TRASLAEA</h1>
    
    <canvas id="pong"></canvas>
    
    <p>Usa el mouse, las flechas o el dedo</p>

<script>
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext('2d');

    // Ajuste dinámico de pantalla
    function resize() {
        canvas.width = window.innerWidth > 600 ? 600 : window.innerWidth - 20;
        canvas.height = window.innerHeight > 400 ? 400 : window.innerHeight - 150;
    }
    resize();

    let score = 0;
    let level = 1;
    let ballHits = 0;

    const user = { x: 10, y: canvas.height/2 - 50, width: 10, height: 80, score: 0, color: "#fff" };
    const com = { x: canvas.width - 20, y: canvas.height/2 - 50, width: 10, height: 80, score: 0, color: "#f97316" };
    const ball = { x: canvas.width/2, y: canvas.height/2, radius: 8, speed: 5, velocityX: 5, velocityY: 5, color: "#fff" };

    // Controles
    canvas.addEventListener("mousemove", (e) => {
        let rect = canvas.getBoundingClientRect();
        user.y = e.clientY - rect.top - user.height/2;
    });

    canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        let touch = e.touches[0];
        let rect = canvas.getBoundingClientRect();
        user.y = touch.clientY - rect.top - user.height/2;
    }, { passive: false });

    window.addEventListener("keydown", (e) => {
        if(e.key === "ArrowUp") user.y -= 40;
        if(e.key === "ArrowDown") user.y += 40;
    });

    function resetBall() {
        ball.x = canvas.width/2;
        ball.y = canvas.height/2;
        ball.speed = 5 + (level * 0.5);
        ball.velocityX = -ball.velocityX;
    }

    function collision(b, p) {
        return b.x + b.radius > p.x && b.x - b.radius < p.x + p.width &&
               b.y + b.radius > p.y && b.y - b.radius < p.y + p.height;
    }

    function update() {
        ball.x += ball.velocityX;
        ball.y += ball.velocityY;

        // IA Computadora
        com.y += (ball.y - (com.y + com.height/2)) * 0.08;

        // Rebote techo/suelo
        if(ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
            ball.velocityY = -ball.velocityY;
        }

        let player = (ball.x < canvas.width/2) ? user : com;

        if(collision(ball, player)) {
            ballHits++;
            if(ballHits % 5 === 0) { level++; score += 10; ball.speed += 0.5; }
            
            let collidePoint = (ball.y - (player.y + player.height/2)) / (player.height/2);
            let angleRad = (Math.PI/4) * collidePoint;
            let direction = (ball.x < canvas.width/2) ? 1 : -1;
            ball.velocityX = direction * ball.speed * Math.cos(angleRad);
            ball.velocityY = ball.speed * Math.sin(angleRad);
        }

        // Límites paleta usuario
        if(user.y < 0) user.y = 0;
        if(user.y > canvas.height - user.height) user.y = canvas.height - user.height;

        // Puntos
        if(ball.x - ball.radius < 0) { com.score++; resetBall(); level = 1; ballHits = 0; }
        else if(ball.x + ball.radius > canvas.width) { user.score++; score += 5; resetBall(); }
    }

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
    }

    function drawCircle(x, y, r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2, false);
        ctx.fill();
    }

    function render() {
        drawRect(0, 0, canvas.width, canvas.height, "#002855"); // Fondo azul asociación
        drawCircle(ball.x, ball.y, ball.radius, ball.color);
        drawRect(user.x, user.y, user.width, user.height, user.color);
        drawRect(com.x, com.y, com.width, com.height, com.color);
        
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText(user.score, canvas.width/4, 30);
        ctx.fillText(com.score, 3*canvas.width/4, 30);
    }

    function game() {
        update();
        render();
    }

    setInterval(game, 1000/50);
</script>
</body>
</html>
