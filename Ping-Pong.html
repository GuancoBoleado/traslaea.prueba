<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASLAEA - Ping Pong</title>
    <style>
        body { 
            background: #001b3a; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: white; 
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        canvas { 
            border: 4px solid #f97316; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8); 
            border-radius: 15px;
            max-width: 90vw;
            max-height: 60vh;
        }
        h1 { 
            margin: 10px 0; 
            color: #f97316; 
            font-style: italic; 
            font-weight: 900; 
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
            font-size: 1.2rem;
            text-align: center;
        }
        .btn-volver {
            position: absolute;
            top: 20px; left: 20px;
            background: #f97316;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 900;
            font-size: 10px;
            text-transform: uppercase;
            box-shadow: 0 4px 0px #c2410c;
            z-index: 10;
        }
        /* Control de Volumen */
        .volume-container {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }
        input[type=range] { cursor: pointer; accent-color: #f97316; }

        /* Controles Táctiles */
        .controls {
            display: none;
            width: 100%;
            justify-content: space-around;
            padding: 20px 0;
            margin-top: 10px;
        }
        .arrow-btn {
            width: 70px;
            height: 70px;
            background: rgba(249, 115, 22, 0.2);
            border: 3px solid #f97316;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            user-select: none;
        }
        .arrow-btn:active { background: #f97316; transform: scale(0.9); }

        @media (max-width: 800px) {
            .controls { display: flex; }
            h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-volver">← VOLVER</a>
    
    <h1>PING PONG TRASLAEA</h1>

    <div class="volume-container">
        <span>🔈</span>
        <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="0.5">
        <span>🔊</span>
    </div>

    <canvas id="pong"></canvas>

    <div class="controls">
        <div class="arrow-btn" id="btnUp">▲</div>
        <div class="arrow-btn" id="btnDown">▼</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="Ping-Pong.mp3" type="audio/mpeg">
    </audio>

<script>
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext('2d');
    const music = document.getElementById("bgMusic");
    const volumeControl = document.getElementById("volumeControl");

    // --- CARGA DE LOGO (RESTAURADO) ---
    const logoAsoc = new Image();
    logoAsoc.src = "logo.png"; // Asegúrate de que el archivo existe
    // Bandera para saber si la imagen cargó correctamente
    let logoCargado = false;
    logoAsoc.onload = () => { logoCargado = true; };

    canvas.width = 800;
    canvas.height = 500;

    const user = { x: 20, y: canvas.height/2 - 50, width: 15, height: 100, score: 0, color: "#FFFFFF" };
    const com = { x: canvas.width - 35, y: canvas.height/2 - 50, width: 15, height: 100, score: 0, color: "#f97316" };
    const ball = { x: canvas.width/2, y: canvas.height/2, radius: 10, speed: 7, velocityX: 7, velocityY: 7, color: "#FFFFFF" };

    // Música y Volumen
    volumeControl.addEventListener("input", (e) => {
        music.volume = e.target.value;
    });

    function iniciarMusica() {
        music.play().catch(e => console.log("Audio bloqueado inicialmente"));
        window.removeEventListener('touchstart', iniciarMusica);
        window.removeEventListener('click', iniciarMusica);
    }
    window.addEventListener('touchstart', iniciarMusica);
    window.addEventListener('click', iniciarMusica);

    // Controles
    let upPressed = false;
    let downPressed = false;

    // Teclado
    window.addEventListener("keydown", (e) => {
        if(e.key === "ArrowUp") upPressed = true;
        if(e.key === "ArrowDown") downPressed = true;
    });
    window.addEventListener("keyup", (e) => {
        if(e.key === "ArrowUp") upPressed = false;
        if(e.key === "ArrowDown") downPressed = false;
    });

    // Flechas Celular
    const btnUp = document.getElementById("btnUp");
    const btnDown = document.getElementById("btnDown");

    btnUp.addEventListener("touchstart", (e) => { e.preventDefault(); upPressed = true; });
    btnUp.addEventListener("touchend", () => { upPressed = false; });
    btnDown.addEventListener("touchstart", (e) => { e.preventDefault(); downPressed = true; });
    btnDown.addEventListener("touchend", () => { downPressed = false; });

    // Mouse y Touch directo en canvas
    canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        let touch = e.touches[0];
        let rect = canvas.getBoundingClientRect();
        let scaleY = canvas.height / rect.height;
        user.y = (touch.clientY - rect.top) * scaleY - user.height/2;
    }, { passive: false });

    canvas.addEventListener("mousemove", (e) => {
        let rect = canvas.getBoundingClientRect();
        let scaleY = canvas.height / rect.height; 
        user.y = (e.clientY - rect.top) * scaleY - user.height/2;
    });

    function collision(b, p) {
        return b.x + b.radius > p.x && b.x - b.radius < p.x + p.width &&
               b.y + b.radius > p.y && b.y - b.radius < p.y + p.height;
    }

    function resetBall() {
        ball.x = canvas.width/2;
        ball.y = canvas.height/2;
        ball.speed = 7;
        ball.velocityX = -ball.velocityX;
    }

    function update() {
        if(upPressed) user.y -= 8;
        if(downPressed) user.y += 8;

        ball.x += ball.velocityX;
        ball.y += ball.velocityY;

        com.y += (ball.y - (com.y + com.height/2)) * 0.1;

        if(ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
            ball.velocityY = -ball.velocityY;
        }

        let player = (ball.x < canvas.width/2) ? user : com;

        if(collision(ball, player)) {
            let collidePoint = (ball.y - (player.y + player.height/2)) / (player.height/2);
            let angleRad = (Math.PI/4) * collidePoint;
            let direction = (ball.x < canvas.width/2) ? 1 : -1;
            ball.velocityX = direction * ball.speed * Math.cos(angleRad);
            ball.velocityY = ball.speed * Math.sin(angleRad);
            ball.speed += 0.4;
        }

        if(ball.x - ball.radius < 0) { com.score++; resetBall(); }
        else if(ball.x + ball.radius > canvas.width) { user.score++; resetBall(); }

        if(user.y < 0) user.y = 0;
        if(user.y > canvas.height - user.height) user.y = canvas.height - user.height;
    }

    function render() {
        // Fondo
        ctx.fillStyle = "#002855";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- DIBUJO DEL LOGO CENTRAL (RESTAURADO) ---
        let centerX = canvas.width / 2;
        let centerY = canvas.height / 2;
        let radioCírculo = 90;

        ctx.save();
        // Establecer transparencia para la marca de agua (20%)
        ctx.globalAlpha = 0.2;

        // 1. Dibujar el círculo naranja de fondo
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(centerX, centerY, radioCírculo, 0, Math.PI * 2);
        ctx.fill();

        // 2. Dibujar la imagen del logo encima del círculo (si cargó)
        if (logoCargado) {
            // Creamos un recorte circular para que la imagen no se salga del borde naranja
            ctx.beginPath();
            ctx.arc(centerX, centerY, radioCírculo, 0, Math.PI * 2);
            ctx.clip();

            // Dibujar la imagen centrada. Ajustamos el tamaño para que llene el círculo (radio * 2)
            let tamañoLogo = radioCírculo * 2;
            ctx.drawImage(logoAsoc, centerX - radioCírculo, centerY - radioCírculo, tamañoLogo, tamañoLogo);
        }
        ctx.restore(); // Restaurar transparencia normal para el resto del juego

        // Línea central dashes
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // Marcadores
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.font = "bold 80px Arial";
        ctx.fillText(user.score, canvas.width/4 - 20, 100);
        ctx.fillText(com.score, 3*canvas.width/4 - 20, 100);

        // Pelota
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        ctx.fill();

        // Paletas
        ctx.fillStyle = user.color;
        ctx.fillRect(user.x, user.y, user.width, user.height);
        ctx.fillStyle = com.color;
        ctx.fillRect(com.x, com.y, com.width, com.height);
    }

    function loop() {
        update();
        render();
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
