<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo • TRASLAEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #001220; }
        .bg-glow { box-shadow: 0 0 50px -12px rgba(249, 115, 22, 0.3); }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-orange-500 italic uppercase tracking-tighter">TRASLAEA</h1>
            <p class="text-blue-300 text-[10px] tracking-[0.4em] uppercase opacity-60 mt-2">Sistema de Gestión Contable</p>
        </div>

        <div class="bg-white/5 border border-white/10 p-8 md:p-10 rounded-[2.5rem] shadow-2xl bg-glow backdrop-blur-sm">
            <form id="loginForm" class="flex flex-col gap-5">
                <div>
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2 mb-2 block">Usuario / Email</label>
                    <input type="email" id="email" placeholder="ejemplo@traslaea.org" required 
                           class="w-full bg-[#001220] border border-white/10 p-4 rounded-xl focus:border-orange-500 outline-none transition text-white">
                </div>

                <div>
                    <label class="text-[10px] uppercase font-bold text-orange-500/50 ml-2 mb-2 block">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required 
                           class="w-full bg-[#001220] border border-white/10 p-4 rounded-xl focus:border-orange-500 outline-none transition text-white">
                </div>

                <button type="submit" id="btnLogin" class="w-full mt-4 bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest transition-all shadow-lg shadow-orange-500/20 active:scale-95">
                    Iniciar Sesión
                </button>
            </form>
            
            <div id="mensajeError" class="hidden mt-6 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-xs text-center">
                </div>
        </div>

        <p class="text-center mt-8 text-[10px] text-blue-300/40 uppercase tracking-widest">
            Acceso restringido para mflores, rbalmaceda y ecolombo
        </p>
    </div>

    <script type="module">
        import { supabase } from './base-de-datos.js';

        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const mensajeError = document.getElementById('mensajeError');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI de carga
            btnLogin.innerText = "VERIFICANDO...";
            btnLogin.disabled = true;
            mensajeError.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 1. Intento de Login
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                // Error de credenciales
                mensajeError.innerText = "Acceso incorrecto: " + error.message;
                mensajeError.classList.remove('hidden');
                btnLogin.innerText = "INICIAR SESIÓN";
                btnLogin.disabled = false;
            } else {
                // 2. Login exitoso -> Registrar acceso en la tabla (opcional pero recomendado)
                try {
                    await supabase.from('registros_acceso').insert([
                        { usuario_email: data.user.email }
                    ]);
                } catch (logError) {
                    console.warn("No se pudo registrar el log, pero el login fue exitoso.");
                }

                // 3. Redirigir al panel
                window.location.href = 'panel_contador.html';
            }
        });
    </script>
</body>
</html>
